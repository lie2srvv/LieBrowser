name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify LieBrowser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK packages
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch Android Components
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble ForkRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          ./gradlew app:assembleForkRelease --stacktrace --no-daemon

      - name: Upload arm64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LieBrowser-arm64-v8a.apk
          path: gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease-unsigned.apk
          if-no-files-found: warn
